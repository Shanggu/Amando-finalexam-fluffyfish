<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <title>Flappy Fish</title>
</head>
<body>
  <div id="game">
    <div id="score">Score: 0</div>
    <div id="menu">
      <h1>🐟 Flappy Fish</h1>
      <p>Help the fish swim through the pipes!<br/>Avoid hitting them or you'll lose!</p>
      <p>Tap or press space to swim!</p>
      <button onclick="startGame()">Start Game</button>
    </div>
    <img id="fish" src="assets/fish.png" alt="fish" />
    <div id="offline">🔌 No internet connection</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
